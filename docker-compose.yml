services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dist:/home/node/.n8n/custom/node_modules/@documenso/n8n-nodes-documenso/dist
      - ./package.json:/home/node/.n8n/custom/node_modules/@documenso/n8n-nodes-documenso/package.json
    environment:
      - N8N_LOG_LEVEL=info

volumes:
  n8n_data:
